# Stage-2 risk-head training config. JSCC params must match stage1.
resolution: 384
batch_size: 2

c_base: 0.25
c_sem: 0.125
c_fid: 0.125
sem_embed_len: 16
jscc_width: 128
jscc_res_blocks: 2

strength: 0.12
num_inference_steps: 25
guidance_scale: 1.0
k_samples: 1
mc_samples: 1
channel_stat_dim: 2

lr: 1e-4
epochs: 5
output_dir: ./runs/stage2
jscc_ckpt: ./runs/stage1/stage1_jscc_test.pt
